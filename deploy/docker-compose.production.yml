name: repolens

services:
  repolens:
    image: ${REPOLENS_IMAGE:-ghcr.io/rezart/repolens:main}
    pull_policy: always
    container_name: repolens
    restart: unless-stopped
    env_file:
      - /opt/repolens/subscription.env
    environment:
      REPOLENS_HOST: 0.0.0.0
      MODEL_BILLING_MODE: subscription_only
      LLM_PROVIDER: subscription
      SUBSCRIPTION_SOCKET_PATH: /run/software-factory/complete.sock
    ports:
      - '192.168.7.195:3010:3000'
    volumes:
      - /opt/repolens/subscription.env:/app/.env:ro
      - repolens-data:/data
      - /run/software-factory-review:/run/software-factory:ro
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  repolens-data:
    external: true
