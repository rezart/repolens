name: repolens

services:
  repolens:
    image: ghcr.io/rezart/repolens:main
    pull_policy: always
    container_name: repolens
    restart: unless-stopped
    ports:
      - '192.168.7.195:3010:3000'
    volumes:
      - /opt/repolens/.env:/app/.env:ro
      - repolens-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/api/health', r => { if (r.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  repolens-data:
    external: true
